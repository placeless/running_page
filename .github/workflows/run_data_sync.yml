# Fork-specific private COROS → FIT → SQLite → redacted JSON publication.
# The frontend is deployed separately by Vercel, not GitHub Pages.
name: Run Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - .github/workflows/run_data_sync.yml
      - run_page/coros_sync.py
      - run_page/config.py
      - run_page/gen_svg.py
      - run_page/generator/**
      - run_page/gpxtrackposter/**
      - run_page/privacy_export.py
      - run_page/reconciliation.py
      - run_page/utils.py
      - requirements.txt

# A manual or scheduled run may update both repositories; never interrupt it
# with a concurrent writer or allow a review branch to publish.
concurrency:
  group: running-data-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  COROS_SYNC_SINCE: '2026-06-30'
  RUNNING_PRIVACY_DELAY_HOURS: '0'
  COROS_REFRESH_RECENT_DAYS: '7'
  COROS_DOWNLOAD_ALLOWED_HOSTS: ${{ vars.COROS_DOWNLOAD_ALLOWED_HOSTS }}
  RUNNING_FIT_TIMEZONE: Europe/Madrid

jobs:
  sync:
    name: Sync and publish public aggregates
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Require private archive before downloading raw GPS
        env:
          PRIVATE_REPO: ${{ vars.RUNNING_PRIVATE_REPOSITORY }}
          PRIVATE_DEPLOY_KEY: ${{ secrets.RUNNING_PRIVATE_DEPLOY_KEY }}
        run: |
          # This fork pins the trusted archive. Change it only after an
          # explicit security review when adapting this workflow elsewhere.
          if [ "$PRIVATE_REPO" != 'placeless/running-data-private' ] || [ -z "$PRIVATE_DEPLOY_KEY" ]; then
            echo 'Private GPS archive not configured; public sync blocked.' >&2
            exit 1
          fi
          node scripts/check-public-repository.mjs

      - name: Checkout private GPS archive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RUNNING_PRIVATE_REPOSITORY }}
          ssh-key: ${{ secrets.RUNNING_PRIVATE_DEPLOY_KEY }}
          ref: main
          path: .private-running-data
          persist-credentials: true

      - name: Restore private GPS data
        run: |
          test -s .private-running-data/data.db || { echo 'Private database is missing; refusing sync.' >&2; exit 1; }
          cp .private-running-data/data.db run_page/data.db
          for folder in FIT_OUT GPX_OUT TCX_OUT activities; do
            mkdir -p "$folder"
            if [ -d ".private-running-data/$folder" ]; then
              cp -a ".private-running-data/$folder/." "$folder/"
            fi
          done
          if [ -f .private-running-data/imported.json ]; then
            cp .private-running-data/imported.json imported.json
          fi

      - name: Prepare private publication policy
        env:
          POLICY: ${{ secrets.RUNNING_PRIVACY_POLICY_JSON }}
        run: |
          mkdir -p private
          if [ -z "$POLICY" ]; then
            echo 'Missing RUNNING_PRIVACY_POLICY_JSON; refusing to publish.' >&2
            exit 1
          fi
          printf '%s' "$POLICY" > private/privacy.json
          chmod 600 private/privacy.json
          echo RUNNING_PRIVACY_CONFIG=private/privacy.json >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download COROS updates and generate privacy-filtered JSON
        env:
          RUNNING_AUDIT_INDEX_FILE: private/coros-index.json
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: |
          python run_page/coros_sync.py \
            --since "$COROS_SYNC_SINCE" \
            --refresh-recent-days "$COROS_REFRESH_RECENT_DAYS"

      - name: Verify public privacy export
        run: python run_page/privacy_export.py --check src/static/activities.json

      - name: Reconcile COROS inventory with public totals
        run: |
          python run_page/reconciliation.py \
            --index private/coros-index.json \
            --fit-dir FIT_OUT --manifest imported.json \
            --database run_page/data.db --public src/static/activities.json

      - name: Back up original GPS data to private archive
        run: |
          cp run_page/data.db .private-running-data/data.db
          for folder in FIT_OUT GPX_OUT TCX_OUT activities; do
            mkdir -p ".private-running-data/$folder"
            cp -a "$folder/." ".private-running-data/$folder/"
          done
          if [ -f imported.json ]; then
            cp imported.json .private-running-data/imported.json
          fi
          git -C .private-running-data config user.email 'action@github.com'
          git -C .private-running-data config user.name 'GitHub Action'
          git -C .private-running-data add -- data.db FIT_OUT GPX_OUT TCX_OUT activities
          if [ -f .private-running-data/imported.json ]; then
            git -C .private-running-data add -- imported.json
          fi
          if ! git -C .private-running-data diff --cached --quiet; then
            git -C .private-running-data commit -m 'archive private running data'
            git -C .private-running-data push
          fi

      - name: Commit only sanitized public activity JSON
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add -- src/static/activities.json
          if ! git diff --cached --quiet; then
            git commit -m 'update new runs'
            git push
          fi
